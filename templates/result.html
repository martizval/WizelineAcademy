<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Your Exercise & Diet Plan</title>

    <link
        rel="stylesheet"
        href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"
    >

    <style>
        body {
            background-color: #f5f5f5;
        }

        .container {
            max-width: 900px;
            margin-top: 50px;
            margin-bottom: 50px;
        }

        .result-card {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .result {
            white-space: pre-wrap;
            line-height: 1.7;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="result-card">

        <h1 class="text-center mb-4">
            Your Exercise & Diet Plan
        </h1>

        <div class="result">
            {{ workout_and_diet_plan }}
        </div>

        <hr>

        <a
            href="{{ url_for('index') }}"
            class="btn btn-primary btn-block"
        >
            Create Another Plan
        </a>

    </div>

</div>

</body>
</html>
